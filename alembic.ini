# Alembic configuration for DEEP-TRACE.
#
# In production we use Alembic for schema migrations instead of the
# `init_db()` create-all path. The application is still compatible
# with both — create_all is fine for dev/test.
#
# To create a new migration after schema changes:
#   alembic revision --autogenerate -m "add new column"
#   alembic upgrade head
#
# To apply pending migrations:
#   alembic upgrade head
#
# The DATABASE_URL is read from the app's Pydantic Settings via env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@db:5432/deeptrace

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
